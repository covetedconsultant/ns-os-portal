<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>North Star OS</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1a1a1a;
      color: #e0e0e0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-card {
      background: #242424;
      border: 1px solid #333;
      border-radius: 16px;
      padding: 48px 40px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 32px;
    }
    .logo-star {
      width: 36px;
      height: 36px;
      background: #B8860B;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }
    .logo-text {
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.3px;
    }
    .logo-sub {
      font-size: 11px;
      color: #888;
      margin-top: 1px;
    }
    h2 {
      font-size: 22px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 8px;
    }
    .subtitle {
      font-size: 13px;
      color: #888;
      margin-bottom: 28px;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #aaa;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }
    input {
      width: 100%;
      background: #1a1a1a;
      border: 1px solid #444;
      border-radius: 8px;
      padding: 12px 14px;
      color: #fff;
      font-size: 14px;
      margin-bottom: 18px;
      outline: none;
      transition: border 0.15s;
    }
    input:focus { border-color: #B8860B; }
    .btn-primary {
      width: 100%;
      background: #B8860B;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 13px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-primary:hover { background: #D4A017; }
    .btn-primary:disabled { background: #555; cursor: not-allowed; }
    .error-msg {
      background: #3d1515;
      border: 1px solid #6b2020;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      color: #f08080;
      margin-bottom: 16px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="logo">
      <div class="logo-star">★</div>
      <div>
        <div class="logo-text">North Star OS</div>
        <div class="logo-sub">Chief of Staff Portal</div>
      </div>
    </div>
    <h2>Welcome back</h2>
    <p class="subtitle">Sign in to access your operating system</p>
    <div class="error-msg" id="error-msg"></div>
    <form id="login-form">
      <label>Email</label>
      <input type="email" id="email" placeholder="your@email.com" required autocomplete="email" />
      <label>Password</label>
      <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password" />
      <button type="submit" class="btn-primary" id="login-btn">Sign In</button>
    </form>
  </div>
  <script src="app.js"></script>
</body>
</html>
