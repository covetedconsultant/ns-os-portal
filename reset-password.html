<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>North Star OS — Reset Password</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1a1a1a;
      color: #e0e0e0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #242424;
      border: 1px solid #333;
      border-radius: 16px;
      padding: 48px 40px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 32px;
    }
    .logo-star {
      width: 36px;
      height: 36px;
      background: #B8860B;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }
    .logo-text {
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.3px;
    }
    .logo-sub {
      font-size: 11px;
      color: #888;
      margin-top: 1px;
    }
    h2 {
      font-size: 22px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 8px;
    }
    .subtitle {
      font-size: 13px;
      color: #888;
      margin-bottom: 28px;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #aaa;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }
    input {
      width: 100%;
      background: #1a1a1a;
      border: 1px solid #444;
      border-radius: 8px;
      padding: 12px 14px;
      color: #fff;
      font-size: 14px;
      margin-bottom: 18px;
      outline: none;
      transition: border 0.15s;
    }
    input:focus { border-color: #B8860B; }
    .btn-primary {
      width: 100%;
      background: #B8860B;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 13px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-primary:hover { background: #D4A017; }
    .btn-primary:disabled { background: #555; cursor: not-allowed; }
    .error-msg {
      background: #3d1515;
      border: 1px solid #6b2020;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      color: #f08080;
      margin-bottom: 16px;
      display: none;
    }
    .success-msg {
      background: #14301c;
      border: 1px solid #245c33;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      color: #7fd99a;
      margin-bottom: 16px;
      display: none;
    }
    .sign-in-link {
      display: block;
      text-align: center;
      margin-top: 16px;
      font-size: 13px;
      color: #B8860B;
      text-decoration: none;
    }
    .sign-in-link:hover { color: #D4A017; text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="logo-star">★</div>
      <div>
        <div class="logo-text">North Star OS</div>
        <div class="logo-sub">Chief of Staff Portal</div>
      </div>
    </div>

    <div id="form-view">
      <h2>Set a new password</h2>
      <p class="subtitle">Choose a new password for your account</p>
      <div class="error-msg" id="error-msg"></div>
      <div class="success-msg" id="success-msg"></div>
      <form id="new-password-form">
        <label>New Password</label>
        <input type="password" id="new-password" placeholder="••••••••" required autocomplete="new-password" minlength="8" />
        <label>Confirm Password</label>
        <input type="password" id="confirm-password" placeholder="••••••••" required autocomplete="new-password" minlength="8" />
        <button type="submit" class="btn-primary" id="submit-btn">Update Password</button>
      </form>
    </div>

    <div id="invalid-view" style="display:none;">
      <h2>Link expired or invalid</h2>
      <p class="subtitle">This password reset link is no longer valid. Please request a new one.</p>
      <a href="index.html" class="sign-in-link">Back to sign in</a>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://omjsqianefykbebnrdmp.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9tanNxaWFuZWZ5a2JlYm5yZG1wIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM1OTk3MjIsImV4cCI6MjA4OTE3NTcyMn0.BhFsvgeCakxDeP0UQM38ryPtlppnapl2RgBqkq5HkEs';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const formView = document.getElementById('form-view');
    const invalidView = document.getElementById('invalid-view');
    const form = document.getElementById('new-password-form');
    const errEl = document.getElementById('error-msg');
    const successEl = document.getElementById('success-msg');
    const submitBtn = document.getElementById('submit-btn');

    let hasRecoverySession = false;

    // Supabase redirects here with a recovery token in the URL hash/fragment.
    // The client SDK auto-detects it and fires PASSWORD_RECOVERY when ready.
    supabaseClient.auth.onAuthStateChange((event, session) => {
      if (event === 'PASSWORD_RECOVERY') {
        hasRecoverySession = true;
      }
    });

    // Fallback check: after a short wait, confirm we actually have a session
    // from the recovery link. If not, the link was invalid/expired.
    setTimeout(async () => {
      if (!hasRecoverySession) {
        const { data } = await supabaseClient.auth.getSession();
        if (!data?.session) {
          formView.style.display = 'none';
          invalidView.style.display = 'block';
        }
      }
    }, 2500);

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const newPassword = document.getElementById('new-password').value;
      const confirmPassword = document.getElementById('confirm-password').value;

      errEl.style.display = 'none';
      successEl.style.display = 'none';

      if (newPassword !== confirmPassword) {
        errEl.textContent = 'Passwords do not match.';
        errEl.style.display = 'block';
        return;
      }
      if (newPassword.length < 8) {
        errEl.textContent = 'Password must be at least 8 characters.';
        errEl.style.display = 'block';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Updating…';

      const { error } = await supabaseClient.auth.updateUser({ password: newPassword });

      submitBtn.disabled = false;
      submitBtn.textContent = 'Update Password';

      if (error) {
        errEl.textContent = 'Could not update password. Your reset link may have expired — request a new one.';
        errEl.style.display = 'block';
        console.error('Password update failed:', error);
        return;
      }

      successEl.textContent = 'Password updated. Redirecting you to sign in…';
      successEl.style.display = 'block';
      form.reset();
      setTimeout(() => {
        supabaseClient.auth.signOut().finally(() => {
          window.location.href = 'index.html';
        });
      }, 1800);
    });
  </script>
</body>
</html>
